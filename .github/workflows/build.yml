name: Build Split36 Firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:3.5
    strategy:
      fail-fast: false
      matrix:
        include:
          - shield: split36_left
          - shield: split36_right
          - shield: settings_reset
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize West Workspace
        run: |
          west init -l config
          west update
          west zephyr-export

      - name: Build Firmware (${{ matrix.shield }})
        run: |
          west build -s zmk/app -d "build/${{ matrix.shield }}" -b nice_nano_v2 -- \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" \
            -DBOARD_ROOT="${GITHUB_WORKSPACE}" \
            -DSHIELD="${{ matrix.shield }}"

      - name: Stage Artifact
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cp "build/${{ matrix.shield }}/zephyr/zmk.uf2" "${GITHUB_WORKSPACE}/artifacts/${{ matrix.shield }}_nice_nano_v2.uf2"
          # Ensure file permissions are world-readable for the host runner
          chmod -R 777 "${GITHUB_WORKSPACE}/artifacts"

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shield }}_nice_nano_v2
          path: ${{ github.workspace }}/artifacts/${{ matrix.shield }}_nice_nano_v2.uf2
          if-no-files-found: error