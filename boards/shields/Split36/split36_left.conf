# Force internal RC oscillator on clone nice!nano boards lacking external 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Bluetooth radio power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Bypass failing PNP_ID characteristic read in BlueZ
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# Enforce unauthenticated access / permissive GATT reads
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Ensure sufficient GATT attribute count and memory for HID + Split services
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=69

# Stack sizing to prevent thread overflow during descriptor negotiation
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_CTLR_RX_BUFFERS=4

# Required on central to register Mouse/Trackball HID Report tables with host
CONFIG_ZMK_POINTING=y